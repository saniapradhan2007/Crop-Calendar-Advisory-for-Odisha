<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Odisha Crop Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container-fluid max-width-container">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-wheat-awn"></i>Odisha Crop Calendar</a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <button id="langToggleBtn" onclick="toggleLanguage()" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-bold">ଓଡ଼ିଆ</button>
        <button id="themeToggleBtn" onclick="toggleTheme()" class="btn btn-outline-secondary btn-sm rounded-circle" style="width:36px; height:36px;"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-circle d-inline-block mb-2">
              <i class="fas fa-user-plus fa-2x"></i>
            </div>
            <h3 class="fw-bold text-dark">Register New Account</h3>
            <p class="text-muted small">Join Odisha Agriculture Portal to receive tailored advisories</p>
          </div>

          <form id="registerForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label font-weight-bold text-dark">Full Name</label>
                <input type="text" id="regName" class="form-control" placeholder="Ramesh Sahoo" required>
              </div>

              <div class="col-md-6">
                <label class="form-label font-weight-bold text-dark">Email Address</label>
                <input type="email" id="regEmail" class="form-control" placeholder="ramesh@example.com" required>
              </div>

              <div class="col-md-6">
                <label class="form-label font-weight-bold text-dark">Password</label>
                <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
              </div>

              <div class="col-md-6">
                <label class="form-label font-weight-bold text-dark">User Role</label>
                <select id="regRole" class="form-select" required>
                  <option value="Farmer" selected>Farmer</option>
                  <option value="Agriculture Officer">Agriculture Officer</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label font-weight-bold text-dark">District</label>
                <select id="regDistrict" class="form-select" required>
                  <option value="Cuttack" selected>Cuttack</option>
                  <option value="Angul">Angul</option>
                  <option value="Balasore">Balasore</option>
                  <option value="Bargarh">Bargarh</option>
                  <option value="Bhadrak">Bhadrak</option>
                  <option value="Bolangir">Bolangir</option>
                  <option value="Dhenkanal">Dhenkanal</option>
                  <option value="Ganjam">Ganjam</option>
                  <option value="Jagatsinghpur">Jagatsinghpur</option>
                  <option value="Jajpur">Jajpur</option>
                  <option value="Jharsuguda">Jharsuguda</option>
                  <option value="Kalahandi">Kalahandi</option>
                  <option value="Kandhamal">Kandhamal</option>
                  <option value="Kendrapara">Kendrapara</option>
                  <option value="Kendujhar">Kendujhar</option>
                  <option value="Khordha">Khordha</option>
                  <option value="Koraput">Koraput</option>
                  <option value="Malkangiri">Malkangiri</option>
                  <option value="Mayurbhanj">Mayurbhanj</option>
                  <option value="Nabarangpur">Nabarangpur</option>
                  <option value="Nayagarh">Nayagarh</option>
                  <option value="Nuapada">Nuapada</option>
                  <option value="Puri">Puri</option>
                  <option value="Rayagada">Rayagada</option>
                  <option value="Sambalpur">Sambalpur</option>
                  <option value="Subarnapur">Subarnapur</option>
                  <option value="Sundargarh">Sundargarh</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label font-weight-bold text-dark">Mobile Phone</label>
                <input type="tel" id="regPhone" class="form-control" placeholder="9876543210">
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mt-4 mb-3">
              <i class="fas fa-check-circle me-2"></i>Create Account
            </button>
          </form>

          <div class="text-center border-top pt-3">
            <span class="text-muted small">Already have an account?</span>
            <a href="/login.html" class="fw-bold text-primary text-decoration-none ms-1">Login Here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
